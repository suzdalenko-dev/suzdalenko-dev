
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ritmo de producción industrial en tiempo real</title>

  <link rel="icon" type="image/png" href="https://github.com/fluidicon.png" title="GitHub">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg-page: #101820;
      --panel-bg: #f3f6f8;
      --panel-bg-soft: #e7edf2;
      --steel-dark: #1f2a33;
      --steel: #344552;
      --steel-soft: #d7dee4;
      --blue-industrial: #0f4c81;
      --blue-industrial-dark: #0a355d;
      --blue-line: #1769aa;
      --cyan-point: #2f9ed8;
      --green-ok: #2e7d32;
      --amber-alert: #c77800;
      --red-low: #b3261e;
      --text-dark: #111827;
      --text-muted: #52616d;
      --white: #ffffff;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0 25%, transparent 25% 50%, rgba(255, 255, 255, 0.04) 50% 75%, transparent 75%),
        linear-gradient(180deg, #17212b 0%, #0f1720 100%);
      background-size: 34px 34px, auto;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      color: var(--text-dark);
    }

    .dashboard {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      border: 8px solid #111820;
      background: #111820;
    }

    .line-panel {
      width: 100%;
      height: 50vh;
      border-bottom: 7px solid #101820;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, var(--panel-bg) 0%, var(--panel-bg-soft) 100%);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.65);
    }

    .line-panel:last-child {
      border-bottom: none;
    }

    .top-row {
      height: 50px;
      display: grid;
      grid-template-columns: 28% 22% 25% 25%;
      align-items: center;
      background: linear-gradient(180deg, #f8fafc 0%, #e4ebf1 100%);
      border-bottom: 2px solid #aeb8c2;
      font-family: "Arial Black", Arial, sans-serif;
      line-height: 1;
    }

    .top-cell {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(20px, 2.25vw, 40px);
      font-weight: 900;
      color: var(--text-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 8px;
      border-right: 1px solid rgba(52, 69, 82, 0.22);
    }

    .top-cell:last-child {
      border-right: none;
    }

    .top-cell.article {
      justify-content: flex-start;
      padding-left: 22px;
      color: #0b263d;
    }

    .top-cell.range {
      color: var(--steel-dark);
    }

    .top-cell.orange-box {
      background: linear-gradient(180deg, #f2a93b 0%, #c77800 100%);
      color: #111827;
      margin: 5px 26px;
      height: 40px;
      border-radius: 3px;
      border: 1px solid rgba(82, 54, 0, 0.35);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .top-cell.time {
      justify-content: flex-end;
      padding-right: 20px;
      color: #0b263d;
      font-variant-numeric: tabular-nums;
    }

    .metrics-row {
      height: 62px;
      background: linear-gradient(180deg, var(--blue-industrial) 0%, var(--blue-industrial-dark) 100%);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-bottom: 3px solid #101820;
    }

    .metric-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 14px;
      color: var(--white);
      font-family: "Arial Black", Arial, sans-serif;
      font-weight: 900;
      overflow: hidden;
      border-right: 1px solid rgba(255, 255, 255, 0.18);
    }

    .metric-card:last-child {
      border-right: none;
    }

    .metric-title {
      text-align: center;
      font-size: clamp(22px, 2.55vw, 46px);
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 2px 3px rgba(0, 0, 0, 0.28);
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      margin-top: 8px;
      background: rgba(255, 255, 255, 0.82);
      border-radius: 2px;
      overflow: hidden;
      box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.28);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--green-ok);
      transition: width 450ms linear, background 450ms linear;
    }

    .chart-zone {
      flex: 1;
      width: 100%;
      min-height: 0;
      padding: 6px 14px 10px 14px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.94) 0%, rgba(240, 244, 248, 0.96) 100%),
        repeating-linear-gradient(90deg, transparent 0 28px, rgba(15, 76, 129, 0.04) 28px 29px);
    }

    .chart-zone canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .demo-badge {
      position: fixed;
      right: 12px;
      bottom: 10px;
      z-index: 50;
      padding: 6px 11px;
      background: rgba(15, 24, 32, 0.82);
      color: white;
      font-size: 12px;
      border-radius: 3px;
      font-weight: 700;
      letter-spacing: .3px;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    @media (max-width: 900px) {
      .dashboard {
        border-width: 4px;
      }

      .top-row {
        height: 44px;
        grid-template-columns: 35% 22% 20% 23%;
      }

      .metrics-row {
        height: 54px;
      }

      .top-cell.article {
        padding-left: 8px;
      }

      .top-cell.orange-box {
        margin: 4px 8px;
      }
    }
  </style>
</head>

<body>
  <main class="dashboard">

    <!-- LINEA 1 -->
    <section class="line-panel line1">
      <div class="top-row">
        <div class="top-cell article" id="articleName1">Bobina Acero S355 Kg</div>
        <div class="top-cell range" id="minMax1">2600-3200</div>
        <div class="top-cell orange-box" id="pesoMedio1">2.487</div>
        <div class="top-cell time" id="time1">00:00</div>
      </div>

      <div class="metrics-row">
        <div class="metric-card">
          <div class="metric-title" id="kg5_1">5 m: 0 kg/h</div>
          <div class="progress-track">
            <div class="progress-fill" id="bar5_1"></div>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-title" id="kg25_1">25 m: 0 kg/h</div>
          <div class="progress-track">
            <div class="progress-fill" id="bar25_1"></div>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-title" id="kg60_1">1 h: 0 kg/h</div>
          <div class="progress-track">
            <div class="progress-fill" id="bar60_1"></div>
          </div>
        </div>
      </div>

      <div class="chart-zone">
        <canvas id="chart1"></canvas>
      </div>
    </section>

    <!-- LINEA 2 -->
    <section class="line-panel line2">
      <div class="top-row">
        <div class="top-cell article" id="articleName2">Perfil Estructural HEA-200 Kg</div>
        <div class="top-cell range" id="minMax2">1800-2400</div>
        <div class="top-cell orange-box" id="pesoMedio2">1.732</div>
        <div class="top-cell time" id="time2">00:00</div>
      </div>

      <div class="metrics-row">
        <div class="metric-card">
          <div class="metric-title" id="kg5_2">5 m: 0 kg/h</div>
          <div class="progress-track">
            <div class="progress-fill" id="bar5_2"></div>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-title" id="kg25_2">25 m: 0 kg/h</div>
          <div class="progress-track">
            <div class="progress-fill" id="bar25_2"></div>
          </div>
        </div>

        <div class="metric-card">
          <div class="metric-title" id="kg60_2">1 h: 0 kg/h</div>
          <div class="progress-track">
            <div class="progress-fill" id="bar60_2"></div>
          </div>
        </div>
      </div>

      <div class="chart-zone">
        <canvas id="chart2"></canvas>
      </div>
    </section>

  </main>

  <div class="demo-badge">DEMO INDUSTRIAL · Datos simulados · GitHub Pages</div>

  <script>
    const REFRESH_SECONDS = 5;

    /*
      260 puntos x 5 segundos = 21,6 minutos aprox.
      Pantalla dinámica, pero con estética industrial seria.
    */
    const MAX_POINTS = 260;

    /*
      Colores industriales:
      - azul: ritmo real
      - rojo: mínimo
      - verde: máximo / zona OK
      - ámbar: sobre-rendimiento o aviso
    */
    const BLUE_LINE_COLOR = "#1769aa";
    const BLUE_POINT_COLOR = "#2f9ed8";

    const MIN_LINE_COLOR = "#b3261e";
    const MAX_LINE_COLOR = "#2e7d32";

    const GOOD_BAR_COLOR = "#2e7d32";
    const LOW_BAR_COLOR = "#b3261e";
    const HIGH_BAR_COLOR = "#c77800";

    const lines = [
      {
        id: 1,
        article: "Bobina Acero S355 Kg",
        min: 2600,
        max: 3200,
        pesoMedio: 2.487,
        base: 2900,
        volatility: 420,
        chartId: "chart1",
        chart: null,
        labels: [],
        values: []
      },
      {
        id: 2,
        article: "Perfil Estructural HEA-200 Kg",
        min: 1800,
        max: 2400,
        pesoMedio: 1.732,
        base: 2100,
        volatility: 370,
        chartId: "chart2",
        chart: null,
        labels: [],
        values: []
      }
    ];

    function pad2(value) {
      return String(value).padStart(2, "0");
    }

    function formatTime(date) {
      return pad2(date.getHours()) + ":" + pad2(date.getMinutes()) + ":" + pad2(date.getSeconds());
    }

    function formatShortTime(date) {
      return pad2(date.getHours()) + ":" + pad2(date.getMinutes()) + ":" + pad2(date.getSeconds());
    }

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function averageLast(values, count) {
      const slice = values.slice(Math.max(0, values.length - count));

      if (slice.length === 0) {
        return 0;
      }

      const total = slice.reduce((acc, value) => acc + value, 0);
      return total / slice.length;
    }

    function generateValue(line, index) {
      /*
        Ritmo industrial vivo, pero creíble:
        - variaciones rápidas de producción
        - pequeñas microparadas
        - aceleraciones puntuales
        - sin estética exagerada
      */
      const wave = Math.sin(index / 2.2) * line.volatility * 0.72;
      const wave2 = Math.cos(index / 5.2) * line.volatility * 0.42;
      const wave3 = Math.sin(index / 11.5) * line.volatility * 0.28;
      const microVibration = Math.sin(index * 2.15) * line.volatility * 0.12;
      const noise = randomBetween(-line.volatility * 0.82, line.volatility * 0.82);

      let value = line.base + wave + wave2 + wave3 + microVibration + noise;

      if (index % 13 === 0) {
        value -= line.volatility * randomBetween(0.9, 1.6);
      }

      if (index % 23 === 0) {
        value += line.volatility * randomBetween(0.8, 1.5);
      }

      if (index % 41 === 0) {
        value -= line.volatility * randomBetween(0.6, 1.2);
      }

      if (index % 53 === 0) {
        value += line.volatility * randomBetween(1.0, 1.8);
      }

      return Math.round(clamp(value, line.min * 0.64, line.max * 1.34));
    }

    function getBarColor(value, line) {
      if (value < line.min) {
        return LOW_BAR_COLOR;
      }

      if (value > line.max) {
        return HIGH_BAR_COLOR;
      }

      return GOOD_BAR_COLOR;
    }

    function getPercent(value, line) {
      const percent = (value / line.max) * 100;
      return clamp(percent, 0, 100);
    }

    function updateMetric(line, minutes, value) {
      const id = line.id;
      const label = minutes === 60 ? "1 h" : minutes + " m";

      document.getElementById("kg" + minutes + "_" + id).textContent =
        label + ": " + Math.round(value) + " kg/h";

      const bar = document.getElementById("bar" + minutes + "_" + id);
      bar.style.width = getPercent(value, line) + "%";
      bar.style.background = getBarColor(value, line);
    }

    function updateHeader(line) {
      document.getElementById("articleName" + line.id).textContent = line.article;
      document.getElementById("minMax" + line.id).textContent = line.min + "-" + line.max;
      document.getElementById("pesoMedio" + line.id).textContent = line.pesoMedio.toFixed(3);
      document.getElementById("time" + line.id).textContent = formatTime(new Date());
    }

    function updateMetrics(line) {
      const points5 = Math.round((5 * 60) / REFRESH_SECONDS);
      const points25 = Math.round((25 * 60) / REFRESH_SECONDS);
      const points60 = Math.round((60 * 60) / REFRESH_SECONDS);

      const kg5 = averageLast(line.values, points5);
      const kg25 = averageLast(line.values, points25);
      const kg60 = averageLast(line.values, points60);

      updateMetric(line, 5, kg5);
      updateMetric(line, 25, kg25);
      updateMetric(line, 60, kg60);
    }

    const backgroundZonesPlugin = {
      id: "backgroundZonesPlugin",
      beforeDatasetsDraw(chart) {
        const ctx = chart.ctx;
        const chartArea = chart.chartArea;
        const y = chart.scales.y;
        const line = chart.config.options.customLine;

        const top = chartArea.top;
        const bottom = chartArea.bottom;
        const left = chartArea.left;
        const right = chartArea.right;
        const width = right - left;

        const yMin = y.getPixelForValue(line.min);
        const yMax = y.getPixelForValue(line.max);

        ctx.save();

        /*
          Zonas de control industrial:
          - Superior: ámbar suave
          - Dentro de objetivo: verde técnico
          - Inferior: rojo suave
        */
        ctx.fillStyle = "rgba(199, 120, 0, 0.095)";
        ctx.fillRect(left, top, width, Math.max(0, yMax - top));

        ctx.fillStyle = "rgba(46, 125, 50, 0.105)";
        ctx.fillRect(left, yMax, width, Math.max(0, yMin - yMax));

        ctx.fillStyle = "rgba(179, 38, 30, 0.085)";
        ctx.fillRect(left, yMin, width, Math.max(0, bottom - yMin));

        ctx.restore();
      }
    };

    Chart.register(backgroundZonesPlugin);

    function createChart(line) {
      const ctx = document.getElementById(line.chartId);

      return new Chart(ctx, {
        type: "line",
        data: {
          labels: line.labels,
          datasets: [
            {
              label: line.article + " · Ritmo real kg/h",
              data: line.values,
              borderWidth: 4,
              borderColor: BLUE_LINE_COLOR,
              backgroundColor: "rgba(23, 105, 170, 0.10)",
              fill: true,
              pointRadius: 1.9,
              pointHoverRadius: 4,
              pointBorderWidth: 0,
              pointBackgroundColor: BLUE_POINT_COLOR,
              pointBorderColor: BLUE_POINT_COLOR,
              tension: 0.23
            },
            {
              label: "Mínimo " + line.min + " kg/h",
              data: line.labels.map(() => line.min),
              borderWidth: 3,
              borderColor: MIN_LINE_COLOR,
              backgroundColor: "rgba(179, 38, 30, 0.05)",
              pointRadius: 0,
              tension: 0
            },
            {
              label: "Máximo " + line.max + " kg/h",
              data: line.labels.map(() => line.max),
              borderWidth: 3,
              borderColor: MAX_LINE_COLOR,
              backgroundColor: "rgba(46, 125, 50, 0.05)",
              pointRadius: 0,
              tension: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: {
            duration: 320
          },
          customLine: line,
          interaction: {
            mode: "index",
            intersect: false
          },
          plugins: {
            legend: {
              display: true,
              position: "top",
              labels: {
                boxWidth: 36,
                color: "#1f2a33",
                font: {
                  size: 10,
                  weight: "bold"
                }
              }
            },
            tooltip: {
              backgroundColor: "rgba(15, 24, 32, 0.94)",
              titleColor: "#ffffff",
              bodyColor: "#ffffff",
              callbacks: {
                label(context) {
                  return context.dataset.label + ": " + Math.round(context.parsed.y) + " kg/h";
                }
              }
            }
          },
          scales: {
            x: {
              grid: {
                color: "rgba(52, 69, 82, 0.075)"
              },
              ticks: {
                color: "#52616d",
                maxTicksLimit: 18,
                autoSkip: true,
                maxRotation: 0,
                minRotation: 0,
                font: {
                  size: 10
                }
              }
            },
            y: {
              min: Math.round(line.min * 0.64),
              max: Math.round(line.max * 1.34),
              title: {
                display: true,
                text: "KG/H",
                color: "#344552",
                font: {
                  size: 11,
                  weight: "bold"
                }
              },
              grid: {
                color: "rgba(52, 69, 82, 0.095)"
              },
              ticks: {
                color: "#52616d",
                font: {
                  size: 10
                }
              }
            }
          }
        }
      });
    }

    function refreshLimitDatasets(line) {
      line.chart.data.datasets[1].data = line.labels.map(() => line.min);
      line.chart.data.datasets[2].data = line.labels.map(() => line.max);
    }

    function addPoint(line) {
      const now = new Date();
      const nextIndex = line.values.length + 1;
      const value = generateValue(line, nextIndex);

      line.labels.push(formatShortTime(now));
      line.values.push(value);

      if (line.labels.length > MAX_POINTS) {
        line.labels.shift();
        line.values.shift();
      }

      refreshLimitDatasets(line);

      line.chart.update();

      updateHeader(line);
      updateMetrics(line);
    }

    function seedInitialData(line) {
      const now = new Date();

      for (let i = MAX_POINTS - 1; i >= 0; i--) {
        const date = new Date(now.getTime() - i * REFRESH_SECONDS * 1000);
        const index = MAX_POINTS - i;

        line.labels.push(formatShortTime(date));
        line.values.push(generateValue(line, index));
      }
    }

    function boot() {
      lines.forEach(line => {
        seedInitialData(line);
        updateHeader(line);

        line.chart = createChart(line);

        refreshLimitDatasets(line);
        updateMetrics(line);
      });

      setInterval(() => {
        lines.forEach(line => addPoint(line));
      }, REFRESH_SECONDS * 1000);

      setInterval(() => {
        lines.forEach(line => updateHeader(line));
      }, 1000);
    }

    boot();
  </script>
</body>
</html>
